name: Portuguese translation correction
description: Suggest a focused correction to one PT-BR question or explanation.
title: "[PT-BR]: "
labels: ["translation", "pt-BR"]
body:
  - type: input
    id: question
    attributes:
      label: Question ID
      placeholder: aif-q004
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: Affected content
      options: [Stem, Options, Explanation, Multiple fields]
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Portuguese text
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Portuguese text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this more accurate?
      description: Link official AWS Portuguese documentation when terminology is involved.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Review checklist
      options:
        - label: I preserved AWS product names, quantities, acronyms, and answer meaning.
          required: true
        - label: This suggestion does not contain a real or leaked exam question.
          required: true
